services:

  # ─── Frontend standalone (solo para desarrollo del frontend) ─────
  # Para el stack completo usa: cd ../SistemaTickets_backend_365soft && docker compose up --build -d
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Valores tomados del .env (sin defaults hardcodeados)
        - VITE_API_URL
        - VITE_SOCKET_URL
    container_name: tickets_frontend_dev
    restart: unless-stopped
    # Puertos configurables por .env para evitar conflictos entre proyectos
    ports:
      - "${FRONTEND_PORT:-8080}:80"
